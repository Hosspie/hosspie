# Supabase Local Development Configuration
# 📚 참고: https://supabase.com/docs/guides/cli/config

# NestJS GraphQL을 사용하므로 Supabase API (Kong + PostgREST) 비활성화
[api]
enabled = false
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
# 로컬 PostgreSQL 포트
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
# Supabase Studio 포트
port = 54323
api_url = "http://127.0.0.1"

# NestJS에서 인증 처리하므로 이메일 테스트 서버 비활성화
[inbucket]
enabled = false
port = 54324
smtp_port = 54325
pop3_port = 54326
admin_email = "admin@localhost"
sender_name = "Hosspie Local"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# 로컬 Auth 포트
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["http://localhost:8081", "exp://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
s3_host = ""
